name: approve codex review
on:
  issue_comment: {types: [created, edited, deleted]}
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed, ready_for_review, converted_to_draft, review_requested, review_request_removed]
  pull_request_review: {types: [submitted, edited, dismissed]}
  workflow_dispatch:
    inputs:
      pr_number: {description: Pull request number, required: true, type: string}
      operation: {description: Reconcile current evidence, type: choice, options: [reconcile], default: reconcile}
  workflow_call:
    inputs:
      pr_number: {required: true, type: string}
      operation: {required: true, type: string}
      expected_head: {required: true, type: string}
      expected_base: {required: true, type: string}
      head_branch: {required: true, type: string}
      mutation_eligible: {type: boolean, default: true}
permissions: {}
concurrency:
  group: codex-approval-${{ github.repository }}-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
jobs:
  reconcile:
    if: (inputs.operation == '' || inputs.operation == 'reconcile') && (inputs.pr_number != '' || github.event.issue.pull_request || github.event.pull_request)
    runs-on: ubuntu-slim
    permissions: {contents: read, pull-requests: write}
    steps:
      - name: Reconcile current Codex evidence
        run: |
          python3 <<'PY'
          import datetime, json, os, re, subprocess, urllib.parse
          CODEX='chatgpt-codex-connector[bot]'; ACTIONS='github-actions[bot]'
          APPROVAL='<!-- codex-automation-approval:v1 -->'
          CLEAN='Security review completed. No security issues were found in this pull request.'
          def api(path, method='GET', **fields):
              cmd=['gh','api',path,'--method',method]
              if method=='GET':
                  if fields: cmd[2]+=('&' if '?' in path else '?')+urllib.parse.urlencode(fields)
                  if path.endswith(('/comments','/reviews','/reactions')):
                      cmd[2]+=('&' if '?' in cmd[2] else '?')+'per_page=100'; cmd+=['--paginate','--slurp']
                  out=json.loads(subprocess.run(cmd,text=True,capture_output=True,check=True).stdout)
                  return [x for page in out for x in page] if cmd[-1]=='--slurp' else out
              cmd += ['--input', '-']
              return json.loads(subprocess.run(cmd, input=json.dumps(fields), text=True,
                                               capture_output=True, check=True).stdout)
          def bot(x, login):
              u=x.get('user') or {}
              return u.get('login')==login and u.get('type')=='Bot'
          def commit(x, resolve):
              values=re.findall(r'\*\*Reviewed commit:\*\* `([0-9a-f]{7,40})`',x.get('body',''))
              if len(values)!=1:
                  raise ValueError('Codex result has no unique reviewed commit')
              return resolve(values[0])
          def owned(rs):
              return [r for r in rs if bot(r,ACTIONS) and r.get('state')=='APPROVED'
                      and r.get('body','').startswith(APPROVAL)]
          def dismiss(repo,n,rs):
              for r in owned(rs):
                  api(f'repos/{repo}/pulls/{n}/reviews/{r["id"]}/dismissals', 'PUT',
                      message='Current Codex review conditions are not satisfied.')
          def fetch(repo,n):
              return {'repo':repo,'number':n,'pr':api(f'repos/{repo}/pulls/{n}'),
                      'comments':api(f'repos/{repo}/issues/{n}/comments'),
                      'reviews':api(f'repos/{repo}/pulls/{n}/reviews'),
                      'reactions':api(f'repos/{repo}/issues/{n}/reactions')}
          def eligible(s,resolve):
              pr=s['pr']; head=pr['head']['sha']
              if pr['state']!='open' or pr['draft']:
                  return False
              ss=[c for c in s['comments'] if bot(c,CODEX) and c.get('body','').startswith('<!-- codex-pull-request-review-summary -->')]
              if len(ss)!=1:
                  return False
              c=ss[0]; author=c.get('user') or {}
              if not all(author.get(k) for k in ('login','id','node_id')):
                  return False
              m=re.findall(r'<!-- codex-security-review:v1 (.*?) -->',c['body'])
              if len(m)!=1: return False
              security=json.loads(m[0])
              if security.get('status')!='completed' or security.get('headSha')!=head or security.get('repository')!=s['repo'] or security.get('pullRequestNumber')!=s['number']: return False
              for kind in ('Code Review','Security Review'):
                  rows=[x for x in c['body'].splitlines() if '**'+kind+'**' in x]
                  if len(rows)!=1: return False
                  cells=rows[0].split('|'); ref=re.fullmatch(r' `([0-9a-f]{7,40})` ',cells[3]) if len(cells)==6 else None
                  if not ref or not re.search(r'✅ \*\*Completed\*\*',cells[2]) or resolve(ref[1])!=head: return False
              reactions=[r['content'] for r in s['reactions'] if all((r.get('user') or {}).get(k)==author[k] for k in ('login','id','node_id'))]
              if '+1' not in reactions or 'eyes' in reactions: return False
              for x in s['comments']:
                  if not bot(x,CODEX): continue
                  body=x.get('body','')
                  if body.startswith('### 🛡️ Codex Security Review') and commit(x,resolve)==head and CLEAN not in body: return False
                  if body.startswith('Codex Review:') and commit(x,resolve)==head and 'major issues' not in body.lower(): return False
              return True
          def reconcile(api_call, repo, n):
              state=fetch(repo,n)
              try:
                  resolve=lambda sha: api_call(f'repos/{repo}/commits/{sha}')['sha']
                  if not eligible(state,resolve): dismiss(repo,n,state['reviews']); return False
                  if not any(r.get('commit_id')==state['pr']['head']['sha'] for r in owned(state['reviews'])):
                      api_call(f'repos/{repo}/pulls/{n}/reviews','POST',event='APPROVE',commit_id=state['pr']['head']['sha'],body=APPROVAL)
                  return True
              except Exception:
                  dismiss(repo,n,state['reviews']); raise
          if __name__ == '__main__':
              repo=os.environ['GITHUB_REPOSITORY']; n=int(os.environ['PR_NUMBER']); state=fetch(repo,n)
              try:
                  resolve=lambda sha: api(f'repos/{repo}/commits/{sha}')['sha']
                  if not eligible(state,resolve): dismiss(repo,n,state['reviews']); print('Current Codex evidence is not eligible for approval.')
                  elif not any(r.get('commit_id')==state['pr']['head']['sha'] for r in owned(state['reviews'])):
                      api(f'repos/{repo}/pulls/{n}/reviews','POST',event='APPROVE',commit_id=state['pr']['head']['sha'],body=APPROVAL); print('Current completed clean Codex reviews approved.')
              except Exception:
                  dismiss(repo,n,state['reviews']); raise
          PY
  controlled-ci:
    name: ${{ inputs.operation }}
    if: always() && contains(fromJSON('["draft", "ready"]'), inputs.operation)
    runs-on: ubuntu-slim
    permissions: {actions: read, contents: write, pull-requests: write}
    steps:
      - name: Check mutation eligibility
        if: inputs.mutation_eligible == true
        env:
          EXPECTED_HEAD: '${{ inputs.expected_head }}'
          EXPECTED_BASE: '${{ inputs.expected_base }}'
        run: |
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefName,headRepository,isCrossRepository,author)
          test "$(jq -r .headRefOid <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r .baseRefName <<<"$pr")" = "$EXPECTED_BASE"
          test "$(jq -r .headRepository.nameWithOwner <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .isCrossRepository <<<"$pr")" = false
          test "$(jq -r .author.login <<<"$pr")" != dependabot[bot]
      - name: Set draft state
        if: inputs.mutation_eligible == true && inputs.operation == 'draft'
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
      - name: Set ready state
        if: inputs.mutation_eligible == true && inputs.operation == 'ready'
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
