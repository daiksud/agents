name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
  skill-install:
    needs: static-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - name: Install pinned GitHub CLI
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/cli/cli/releases/download/v2.100.0
          curl --fail --silent --show-error --location "$base/gh_2.100.0_linux_amd64.tar.gz" -o gh.tar.gz
          curl --fail --silent --show-error --location "$base/gh_2.100.0_checksums.txt" -o checksums.txt
          awk '$2 == "gh_2.100.0_linux_amd64.tar.gz" {print $1 "  gh.tar.gz"}' checksums.txt | sha256sum --check --strict
          tar -xzf gh.tar.gz
          echo "$RUNNER_TEMP/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - run: python scripts/skill_smoke.py
        env:
          GH_TOKEN: ${{ github.token }}
