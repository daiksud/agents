name: ci-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  draft:
    permissions: {pull-requests: write}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    env: &pr-env
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Set draft state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo

  commit-stage:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.15"
          install: true
          cache: false
      - name: Test Codex approval policy
        run: bash tests/test_workflow_behavior.sh
      - name: Lint Markdown
        run: mise exec -- rumdl check .

  ready:
    needs: commit-stage
    permissions: {pull-requests: write}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    env: *pr-env
    steps:
      - name: Set ready state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  acceptance-stage:
    needs: ready
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.15"
          install: true
          cache: false
      - name: Check local file and frontmatter links
        run: mise exec -- rumdl check --enable MD057 --config 'MD057.check-frontmatter = true' --deny-config-warnings .

  check:
    name: ci
    needs: acceptance-stage
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Check required stages
        if: always()
        env:
          PASSED: ${{ !cancelled() && needs['acceptance-stage'].result == 'success' }}
        run: test "$PASSED" = true
