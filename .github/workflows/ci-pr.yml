name: ci-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  draft:
    if: &eligible >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    permissions: &mutation-permissions
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-slim
    timeout-minutes: 3
    concurrency: &mutation-concurrency
      group: codex-approval-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env: &mutation-env
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.ref }}
    steps: &draft-steps
      - &check-mutation
        name: Check mutation eligibility
        run: |
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefName,headRepository,isCrossRepository,author)
          test "$(jq -r .headRefOid <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r .baseRefName <<<"$pr")" = "$EXPECTED_BASE"
          test "$(jq -r .headRepository.nameWithOwner <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .isCrossRepository <<<"$pr")" = false
          test "$(jq -r .author.login <<<"$pr")" != dependabot[bot]
      - name: Set draft state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo

  commit-stage:
    needs: draft
    # Only fork/Dependabot state mutations are intentionally skipped.
    if: >-
      !cancelled() &&
      (needs.draft.result == 'success' ||
       (needs.draft.result == 'skipped' &&
        (github.event.pull_request.head.repo.full_name != github.repository ||
         github.event.pull_request.head.repo.fork ||
         github.event.pull_request.user.login == 'dependabot[bot]' ||
         github.actor == 'dependabot[bot]')))
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.15"
          install: true
          cache: false
      - name: Check rumdl version
        run: mise exec -- rumdl --version
      - name: Test Codex approval policy
        run: bash tests/test_workflow_behavior.sh
      - name: Lint Markdown
        run: mise exec -- rumdl check .

  ready:
    needs: commit-stage
    if: *eligible
    permissions: *mutation-permissions
    runs-on: ubuntu-slim
    timeout-minutes: 3
    concurrency: *mutation-concurrency
    env: *mutation-env
    steps:
      - *check-mutation
      - name: Set ready state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

  acceptance-stage:
    needs: [commit-stage, ready]
    if: >-
      !cancelled() && needs['commit-stage'].result == 'success' &&
      (needs.ready.result == 'success' ||
       (needs.ready.result == 'skipped' &&
        (github.event.pull_request.head.repo.full_name != github.repository ||
         github.event.pull_request.head.repo.fork ||
         github.event.pull_request.user.login == 'dependabot[bot]' ||
         github.actor == 'dependabot[bot]')))
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.15"
          install: true
          cache: false
      - name: Check local file and frontmatter links
        run: mise exec -- rumdl check --enable MD057 --config 'MD057.check-frontmatter = true' --deny-config-warnings .

  # Failure-only recovery within the check stage.
  return-to-draft:
    needs: [draft, commit-stage, ready, acceptance-stage]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      (cancelled() || needs.draft.result != 'success' ||
       needs['commit-stage'].result != 'success' || needs.ready.result != 'success' ||
       needs['acceptance-stage'].result != 'success')
    permissions: *mutation-permissions
    runs-on: ubuntu-slim
    timeout-minutes: 3
    concurrency: *mutation-concurrency
    env: *mutation-env
    steps: *draft-steps

  check:
    name: ci
    needs: [draft, commit-stage, ready, acceptance-stage, return-to-draft]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    env:
      VALIDATION_PASSED: ${{ needs['commit-stage'].result == 'success' && needs['acceptance-stage'].result == 'success' && ((needs.draft.result == 'success' && needs.ready.result == 'success') || ((github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]' || github.actor == 'dependabot[bot]') && needs.draft.result == 'skipped' && needs.ready.result == 'skipped')) }}
      RECOVERY_RESULT: ${{ needs['return-to-draft'].result }}
    steps:
      - name: Reject cancellation
        if: cancelled()
        run: exit 1
      - name: Aggregate mandatory stages
        if: always()
        run: |
          if [[ "$VALIDATION_PASSED" != true || ( "$RECOVERY_RESULT" != success && "$RECOVERY_RESULT" != skipped ) ]]; then
            echo "A mandatory stage failed, was cancelled, or unexpectedly skipped."
            exit 1
          fi
